name: smart_stock
description: "A application to use on stock"
publish_to: "none"

environment:
  sdk: ^3.8.1

dependencies:
  audioplayers: ^6.5.1
  auto_route: ^10.1.2
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.5
  flutter_dotenv: ^6.0.0
  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.0.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.3
  forui: ^0.16.0
  get_it: ^9.1.0
  google_fonts: ^6.3.2
  hooks_riverpod: ^3.0.3
  http: ^1.5.0
  internet_connection_checker_plus: ^2.9.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.1
  mask_text_input_formatter: ^2.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  riverpod_annotation: ^3.0.0
  riverpod_sqflite: ^0.3.3
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.2.3
  build_runner: ^2.10.4
  riverpod_generator: ^3.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/avatar-placeholder.jpg
    - assets/images/logo-newland-white.svg
    - assets/images/stock.png
    - assets/images/scanner-black-icon.svg
    - assets/images/stock-black-icon.svg
    - assets/audios/store-scanner-beep.mp3
    - .env
  fonts:
    - family: Avenir95
      fonts:
        - asset: assets/fonts/Toyota-Type.ttf
